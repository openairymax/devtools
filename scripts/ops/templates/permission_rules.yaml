# =============================================================================
# AgentRT 工具级权限规则（Tool-level permission rules）
# 版本: v1.1.0
#
# 由 daemon_security 在 daemon 启动时加载（daemon_security_load_rules_file），
# 写入 tool_d / agent_d 等 daemon 的 ACL 表。判定为 fail-closed：
# 未在此文件中显式 allow 的 (agent, tool) 一律拒绝（0x5002 Permission denied）。
#
# 部署位置: $AIRY_CONFIG_DIR/cupolas/permission_rules.yaml
# Schema:   rules: [{agent, tool, effect}]
#   - agent  : 智能体标识（见 ecosystem/agents/*/contract.json 的 agent_id）
#   - tool   : 工具名（与 tool_d 注册的工具名一致，如 fs_read / shell_run）
#   - effect : "allow" 或 "deny"（deny 规则优先于同一 (agent, tool) 的 allow）
#
# v1.1.1：新增网关外部调用方授权（2026-08-31）。gateway_d 将本地
# HTTP/WS JSON-RPC 调用方统一视为 "external"（localhost 个人运行时语义）。
# 0.1.6 P1-4 能力网关对高敏能力（GW_CAP_EXTRA_PERM：agent 控制 / 插件管理 /
# 记忆删除 / 调度管理 / cupolas 管理）做 ACL 授权检查（fail-closed）。
# 本段授予本地会话开箱即用的管理能力；生产部署可按最小权限原则删除
# 不需要的条目（deny 规则优先）。
#
# v1.1.0：按标准角色最小权限授予（2026-08-19）。平台内置 11 个标准 agent
# （analyst/architect/backend/coding/data_engineer/devops/frontend/
# product_manager/reviewer/security/tester）默认可用，否则任务管线的
# 执行体（reactive-agent 归一化到 coding_v1）之外的角色全部被 fail-closed
# 拒绝，工具无法落地。执行类角色授予读/写/命令/版本库工具；验证与规划类
# 角色仅授予只读文件 + 联网工具。生产部署应在此基础按最小权限原则裁剪，
# 并显式 deny 高风险工具。
# =============================================================================

rules:
