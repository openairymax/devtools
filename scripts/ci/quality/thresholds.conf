# AirymaxRT 质量阈值唯一权威源（SSoT）
#
# 立意：复杂度与重复率阈值是"策略数据"，不是"机制代码"。此前同一指标在
#   check-quality.sh（5.0/3.5/10）、gates/complexity-check.sh（15/25/50）、
#   src/unified_quality_analyzer.py（硬编码占位值）与方案 §6.3（G25 2.0~3.5 /
#   G26 3%~5%）四处各写一份，口径互相矛盾且随文档漂移而静默失效。本文件收敛
#   为唯一权威源：所有消费方一律读取此处，禁止内联字面量。
#
# 对齐：方案 §6.3 G25（复杂度 2.0 ~ 3.5）/ G26（重复率 3% ~ 5%）；
#   用户明示目标（平均圈复杂度 < 2.5、重复率 < 3%）作为阶梯目标值，
#   现状（实测平均 CCN ≈ 5.6）经棘轮基线阻挡回归、随 L4/L5 逐批收敛。
#
# 格式：KEY=VALUE（行内 # 起为注释）；bash 侧 source 读取，Python 侧正则解析。

# ── 圈复杂度（lizard，平均 CCN，全模块非测试码口径）────────────────
CCN_AVG_TARGET=2.5    # 平均圈复杂度阶梯目标（用户明示 < 2.5）
CCN_AVG_CEIL=3.5      # 平均圈复杂度硬上限（方案 G25）
CCN_FN_PASS=15        # 单函数 CCN 通过上限（≤ 即 PASS）
CCN_FN_WARN=25        # 单函数 CCN 警告上限（> PASS 且 ≤ 此值 = WARN）
CCN_FN_FAIL=50        # 单函数 CCN 阻断上限（> 此值 = BLOCK）

# ── 重复率（自建克隆检测器，归一化行窗口口径）────────────────────
DUP_TARGET=3.0        # 重复率阶梯目标（用户明示 < 3%，单位 %）
DUP_CEIL=5.0          # 重复率硬上限（方案 G26，单位 %）
DUP_WINDOW=10         # 克隆判定窗口（连续归一化行数）

# ── 负载扇出（G13：拆后 load ≤ 5，并后 fan 不增）──────────────────
# load = 件内部头的 src 面扇入（消费方生产代码文件数）；fan = 目标对项目内
#   库的去重扇出。阈值取方案 §4.4 拆并三裁决上限轨（V16.1）；fan 侧无绝对
#   上限，以 fanout-baseline.txt 棘轮约束（只降不升）。
FANIN_MAX=5           # 头文件 src 面扇入硬上限（方案 §4.4「load ≤ 5」）
